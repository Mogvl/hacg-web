name: Docker Publish

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/mogvl/hacg-web/hacg-web-frontend:latest
            ghcr.io/mogvl/hacg-web/hacg-web-frontend:${{ github.sha }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mogvl/hacg-web/hacg-web-server:latest
            ghcr.io/mogvl/hacg-web/hacg-web-server:${{ github.sha }}