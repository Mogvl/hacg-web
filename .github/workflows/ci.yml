name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build frontend
        run: npm run build

      - name: Backend unit tests
        run: npm test

      - name: Backend smoke test (port 8201)
        run: |
          node backend/src/index.js &
          BACKEND_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:8201/api/health | grep -q '"ok":true' && echo "backend health OK"
          kill $BACKEND_PID